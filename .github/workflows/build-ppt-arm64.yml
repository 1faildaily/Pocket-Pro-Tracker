name: Build Pocket Pro Tracker PT2 ARM64
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libsdl2-dev zip python3 file
      - name: Test controller and patch integration
        run: bash tests/check.sh
      - name: Download upstream ProTracker 2 clone 1.92
        run: |
          git clone --depth 1 --branch v1.92 https://github.com/8bitbubsy/pt2-clone.git upstream
          cp upstream/LICENSE port/pocket_pro_tracker_pt2/LICENSE-PT2-clone
      - name: Apply PPT controller patch
        run: python3 patch/apply_patch.py upstream
      - name: Build original PT2 renderer/audio + PPT input
        run: |
          cmake -S upstream -B upstream/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/build --parallel 4
          file upstream/release/other/pt2-clone
      - name: Assemble PortMaster package
        run: |
          install -m 755 upstream/release/other/pt2-clone port/pocket_pro_tracker_pt2/pt2-clone
          cp upstream/release/other/protracker.ini port/pocket_pro_tracker_pt2/protracker.ini
          cat >> port/pocket_pro_tracker_pt2/protracker.ini <<'EOF'
          ; PPT v0.3.15: XCOPY palette, four-channel VU meters hidden
          VIDEOSCALE=1X
          FULLSCREEN=TRUE
          FULLSCREENSTRETCH=TRUE
                    HWMOUSE=FALSE
          PIXELFILTER=NEAREST
          DEFAULTDIR=mods
          DEFAULTSMPDIR=samples
          EOF
          test -s port/pocket_pro_tracker_pt2/colors.ini
          chmod +x 'port/Pocket Pro Tracker PT2.sh'
          (cd port && zip -qr ../pocket_pro_tracker_pt2.zip 'Pocket Pro Tracker PT2.sh' pocket_pro_tracker_pt2)
          unzip -t pocket_pro_tracker_pt2.zip
          unzip -p pocket_pro_tracker_pt2.zip pocket_pro_tracker_pt2/colors.ini | cmp - port/pocket_pro_tracker_pt2/colors.ini
          echo "XCOPY palette and no-channel-VU patch validated in PortMaster artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: PPT_v0.3.15_RightStickScreens_FastR1Mouse_ARM64
          path: pocket_pro_tracker_pt2.zip
