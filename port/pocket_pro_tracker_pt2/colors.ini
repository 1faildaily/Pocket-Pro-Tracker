; WARNING: DO NOT TOUCH ANYTHING EXCEPT THE HEX VALUES!
; I recommend that you use the palette editor tool instead.
; You can find it at www.16-bits.org/pt.php
;
; Info:
; - Colors are stored as 12-bit RGB in hex (4096 total colors).
;   The palette order is the same as ProTracker on Amiga.
;
; To convert a 24-bit RGB hex value to 12-bit RGB hex, just
; skip every other digit. F.ex. 89ABCD -> 8AC
;
; To convert the other way around, repeat the digits.
; F.ex. 8AC -> 88AACC

[Palette]
600 ; Background
A00 ; GUI box light border / static text
000 ; GUI box background color
400 ; GUI box dark border / static text shadow
FFF ; Quadrascope / disk op. text / pos. ed. text
DFF ; Pattern cursor
F00 ; GUI box (non-static) text
000 ; Pattern text

